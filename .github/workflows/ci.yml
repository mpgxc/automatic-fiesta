name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Escopo atual: daemon macOS + app Android.
#
# O app iOS e a interface de barra de menu existem no repositório mas estão
# FORA do CI de propósito. Os passos estão preservados abaixo, comentados, com
# o que é preciso para religá-los.
#
# A consequência precisa ser dita: código sem CI apodrece. `mobile/ios` e
# `macos/ui` vão acumular quebra silenciosa enquanto o core evolui — a correção
# de subscript ambíguo de Data já teve que tocar o gêmeo iOS, e a próxima
# ninguém vai perceber. Religar cedo é mais barato que consertar depois.
#
#   verify   ubuntu-latest   job barato; a maior parte das invariantes
#   apple    macos-15        daemon + módulo PAM. Deliberadamente não a mais
#                            nova: o daemon tem alvo macOS 13 e precisa rodar
#                            em Macs que ninguém atualizou.
#   android  ubuntu-latest

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Módulo PAM e contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes do módulo PAM sob ASan e UBSan
        # O módulo roda como root dentro do sudo; um bug de memória ali é
        # escalação de privilégio local. Os sanitizers não são opcionais aqui.
        run: |
          cd macos/pam
          gcc -Wall -Wextra -O1 -g -fsanitize=address,undefined \
              -fno-sanitize-recover=all -std=gnu11 -I shim \
              -o test_pam test_pam_phoneauth.c
          ./test_pam

      - name: Compilar o módulo com as flags de produção
        run: |
          cd macos/pam
          gcc -Wall -Wextra -Wconversion -Wshadow -Wpointer-arith -Wwrite-strings \
              -Werror -O2 -std=gnu11 -I shim -c pam_phoneauth.c -o /dev/null

      - name: Guarda — só um caminho para PAM_SUCCESS
        run: |
          cd macos/pam
          n=$(grep -c '^\s*result = PAM_SUCCESS;' pam_phoneauth.c || true)
          echo "atribuições encontradas: $n"
          test "$n" -eq 1 || {
            echo "::error file=macos/pam/pam_phoneauth.c::esperado exatamente 1 'result = PAM_SUCCESS', encontrado $n"
            exit 1
          }

      - name: Guarda — sudo_local nunca instalado como required
        run: |
          if grep -rn --include='*.sh' --include='*.md' -E '^\s*auth\s+required\s+.*pam_phoneauth' . ; then
            echo "::error::pam_phoneauth documentado como 'required'. Tem que ser 'sufficient', senão uma falha tranca o usuário fora da máquina."
            exit 1
          fi

      - name: Guarda — a versão só existe no VERSION
        # O Info.plist da UI ficou em 0.1.0 enquanto o Android já estava em
        # 0.1.1, e nada acusou porque nada comparava as duas. Agora ambos
        # derivam do VERSION, e esta guarda existe para que a segunda cópia não
        # volte a aparecer — é mais fácil recolar um literal do que perceber que
        # ele voltou.
        run: |
          falhou=0

          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION; then
            echo "::error file=VERSION::VERSION precisa conter só MAJOR.MINOR.PATCH"
            falhou=1
          fi

          if grep -nE 'version(Name|Code) *= *"?[0-9]' mobile/android/app/build.gradle.kts; then
            echo "::error file=mobile/android/app/build.gradle.kts::versão literal aqui; ela deve vir do VERSION"
            falhou=1
          fi

          if grep -A1 'CFBundleShortVersionString' macos/ui/Resources/Info.plist | grep -qE '<string>[0-9]'; then
            echo "::error file=macos/ui/Resources/Info.plist::versão literal aqui; o bundle.sh substitui __VERSAO__"
            falhou=1
          fi

          [ "$falhou" -eq 0 ] && echo "a versão vive só no VERSION: $(cat VERSION)"
          exit $falhou

      - name: Vetores de teste são determinísticos
        run: |
          python3 docs/generate-test-vectors.py > /tmp/regenerated.json
          diff -u docs/test-vectors.json /tmp/regenerated.json

      - name: Paridade dos três gêmeos de SignedPayload
        # Continua cobrindo o gêmeo iOS mesmo com o iOS fora do CI: é análise de
        # texto do fonte, roda em qualquer lugar, e é a única coisa que ainda
        # segura aquele arquivo alinhado com o daemon.
        run: python3 docs/check-payload-parity.py

      - name: Protocolo ponta a ponta
        run: |
          pip install --quiet --break-system-packages cryptography
          python3 docs/protocol-harness.py

  # ───────────────────────────────────────────────────────────────────────────
  apple:
    name: Daemon e módulo PAM (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - name: Build do daemon
        run: swift build -c release --package-path macos

      - name: Testes do core
        # Onde os vetores encontram a implementação Swift. Se passarem, a
        # serialização está correta e o gêmeo Android tem alvo confiável.
        run: swift test --package-path macos

      - name: Módulo PAM com o clang do macOS
        run: |
          cd macos/pam
          make
          file pam_phoneauth.so

      # ── Instalador ────────────────────────────────────────────────────────
      #
      # O .pkg é construído a cada push, não só nas tags. O primeiro release
      # falhou num passo de empacotamento que nada exercitava — descobrir isso
      # com a tag já criada custa uma tag queimada, porque tag não se
      # reaproveita. Aqui custa um build vermelho.
      - name: Build universal para o instalador
        run: |
          swift build -c release --arch arm64 --arch x86_64 --package-path macos
          make -C macos/pam clean
          make -C macos/pam \
            CFLAGS="-Wall -Wextra -Wconversion -Wshadow -Wpointer-arith -Wwrite-strings -O2 -std=gnu11 -fstack-protector-strong -arch arm64 -arch x86_64"

      - name: Confirmar que é universal
        id: universal
        run: |
          dir=""
          for candidato in macos/.build/apple/Products/Release macos/.build/release; do
            if [ -x "$candidato/phoneauthd" ] && [ -x "$candidato/phoneauthctl" ]; then
              dir="$candidato"; break
            fi
          done
          if [ -z "$dir" ]; then
            echo "::error::não achei os binários sob macos/.build"
            find macos/.build -maxdepth 5 \( -name 'phoneauth*' -o -name Release \) -print
            exit 1
          fi
          falhou=0
          for b in "$dir/phoneauthd" "$dir/phoneauthctl" macos/pam/pam_phoneauth.so; do
            archs=$(lipo -archs "$b")
            echo "$b: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$b não é universal ($archs)"; falhou=1 ;;
            esac
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          exit $falhou

      - name: Construir o .pkg
        # Versão derivada do commit: este pacote é de verificação, não de
        # distribuição, e um número de versão real aqui faria um artefato de CI
        # se passar por release.
        run: |
          versao="0.0.0-ci.${GITHUB_SHA::7}"
          chmod +x macos/installer/build-pkg.sh macos/installer/scripts/postinstall
          macos/installer/build-pkg.sh "$versao" "${{ steps.universal.outputs.dir }}" \
            "phoneauth-$versao.pkg"

      - name: Conferir o conteúdo do .pkg
        # `pkgbuild` aceita quase tudo em silêncio. Payload vazio, caminho de
        # instalação errado ou postinstall faltando produzem um .pkg
        # perfeitamente válido que não instala nada — e isso só apareceria na
        # máquina de quem baixou.
        #
        # `--expand-full` e não `--payload-files`: o segundo opera sobre pacote
        # de componente, e o que sai do productbuild é um product archive.
        run: |
          pkg=$(ls phoneauth-*.pkg)
          rm -rf /tmp/exp
          pkgutil --expand-full "$pkg" /tmp/exp
          find /tmp/exp -type f | sed 's|^/tmp/exp/||' | sort

          falhou=0
          for exigido in usr/local/bin/phoneauthd \
                         usr/local/bin/phoneauthctl \
                         usr/local/lib/pam/pam_phoneauth.so \
                         Library/LaunchDaemons/dev.phoneauth.daemon.plist \
                         usr/local/share/man/man1/phoneauthctl.1; do
            if ! find /tmp/exp -path "*/Payload/$exigido" | grep -q .; then
              echo "::error::$exigido ausente do payload do .pkg"; falhou=1
            fi
          done

          # Sem o postinstall o pacote copia arquivos e para por aí: não gera a
          # identidade TLS nem sobe o daemon, e o usuário fica com uma
          # instalação silenciosamente inerte.
          if ! find /tmp/exp -path '*/Scripts/postinstall' | grep -q .; then
            echo "::error::postinstall ausente do .pkg"; falhou=1
          fi

          exit $falhou

      - name: Construir e conferir o tarball
        # O .pkg não é o único caminho de instalação: quem prefere script baixa
        # o tarball e roda `sudo ./scripts/install.sh`. Esse caminho quebrou na
        # 0.1.4 sem ninguém notar, porque a montagem do tarball morava dentro do
        # release.yml e só rodava depois da tag — quando já era tarde.
        #
        # A guarda de conteúdo está dentro do build-tarball.sh, e não aqui: ela
        # deriva a lista de exigidos do próprio install.sh, então vale para os
        # dois lugares que constroem o tarball e não pode ser esquecida em um
        # deles.
        run: |
          versao="0.0.0-ci.${GITHUB_SHA::7}"
          chmod +x macos/installer/build-tarball.sh
          macos/installer/build-tarball.sh "$versao" "${{ steps.universal.outputs.dir }}" \
            "phoneauth-$versao-macos.tar.gz"

      # ── FORA DE ESCOPO ────────────────────────────────────────────────────
      # App iOS. Custa pouco — divide este runner, que já está de pé — mas está
      # fora do escopo atual. Para religar, descomente:
      #
      # - name: Compilar o app iOS
      #   run: |
      #     cd mobile/ios
      #     xcodebuild -scheme PhoneAuthKit \
      #                -destination 'generic/platform=iOS' \
      #                -skipPackagePluginValidation \
      #                build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phoneauth-macos-${{ github.sha }}
          path: |
            phoneauth-*.pkg
            macos/pam/pam_phoneauth.so
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        # SignedPayloadTest é JVM puro de propósito: os vetores cross-plataforma
        # rodam sem emulador, no job mais barato possível.
        run: gradle --project-dir mobile/android testDebugUnitTest --no-daemon

      - name: Lint
        # Entra agora que o Android é escopo principal. Não falha o build: o
        # lint do Android acusa muita coisa cosmética, e um job vermelho por
        # motivo cosmético ensina a ignorar job vermelho.
        continue-on-error: true
        run: gradle --project-dir mobile/android lintDebug --no-daemon

      - name: Build do APK de debug
        run: gradle --project-dir mobile/android assembleDebug --no-daemon

      - name: Build de release, para exercitar o R8
        # O buildType de release tem isMinifyEnabled, e por muito tempo nada no
        # CI o compilava — o proguard-rules.pro sequer existia, apesar de
        # referenciado. Num app que vive de Keystore, CryptoObject e ML Kit,
        # ofuscação quebrada aparece só no aparelho do usuário, na hora de
        # aprovar um sudo. Sai sem assinatura aqui de propósito: o objetivo é
        # provar que compila e encolhe, não produzir algo instalável — disso
        # cuida o workflow de release, com a keystore dos secrets.
        run: gradle --project-dir mobile/android assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phoneauth-android-${{ github.sha }}
          # O de release sai como `app-release-unsigned.apk` e o nome é o
          # próprio aviso: sem keystore ele não instala. Assinar a cada push
          # exigiria a chave de release exposta em todo build, e ela é a
          # identidade do app — isso é trabalho do workflow de release, uma vez
          # por versão. Aqui ele serve para provar que o R8 não quebrou.
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
