name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Escolha de runner, resumida — cada build na máquina que ele de fato exige:
#
#   verify     ubuntu-latest   nada de Apple aqui; é o job barato e o que
#                              verifica a maior parte das invariantes.
#   apple      macos-15        daemon (alvo macOS 13) + módulo PAM + app iOS.
#                              Deliberadamente NÃO é a mais nova: construir num
#                              toolchain anterior prova que o daemon não passou
#                              a depender de nada bleeding-edge. Ele precisa
#                              rodar em Macs que ninguém atualizou.
#   apple-ui   macos-26        Liquid Glass não existe antes do SDK 26.
#   android    ubuntu-latest
#
# São dois runners macOS, não três: o app iOS divide a máquina com o daemon
# porque em repositório privado o minuto de macOS custa 10x, e um terceiro
# runner não compraria informação nova.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Módulo PAM e contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes do módulo PAM sob ASan e UBSan
        # O módulo roda como root dentro do sudo; um bug de memória ali é
        # escalação de privilégio local. Os sanitizers não são opcionais aqui.
        run: |
          cd macos/pam
          gcc -Wall -Wextra -O1 -g -fsanitize=address,undefined \
              -fno-sanitize-recover=all -std=gnu11 -I shim \
              -o test_pam test_pam_phoneauth.c
          ./test_pam

      - name: Compilar o módulo com as flags de produção
        run: |
          cd macos/pam
          gcc -Wall -Wextra -Wconversion -Wshadow -Wpointer-arith -Wwrite-strings \
              -Werror -O2 -std=gnu11 -I shim -c pam_phoneauth.c -o /dev/null

      - name: Guarda — só um caminho para PAM_SUCCESS
        run: |
          cd macos/pam
          n=$(grep -c '^\s*result = PAM_SUCCESS;' pam_phoneauth.c || true)
          echo "atribuições encontradas: $n"
          test "$n" -eq 1 || {
            echo "::error file=macos/pam/pam_phoneauth.c::esperado exatamente 1 'result = PAM_SUCCESS', encontrado $n"
            exit 1
          }

      - name: Guarda — sudo_local nunca instalado como required
        run: |
          if grep -rn --include='*.sh' --include='*.md' -E '^\s*auth\s+required\s+.*pam_phoneauth' . ; then
            echo "::error::pam_phoneauth documentado como 'required'. Tem que ser 'sufficient', senão uma falha tranca o usuário fora da máquina."
            exit 1
          fi

      - name: Vetores de teste são determinísticos
        run: |
          python3 docs/generate-test-vectors.py > /tmp/regenerated.json
          diff -u docs/test-vectors.json /tmp/regenerated.json

      - name: Paridade dos três gêmeos de SignedPayload
        run: python3 docs/check-payload-parity.py

      - name: Protocolo ponta a ponta
        run: |
          pip install --quiet --break-system-packages cryptography
          python3 docs/protocol-harness.py

  # ───────────────────────────────────────────────────────────────────────────
  # Daemon, CLI, módulo PAM e app iOS — tudo que NÃO precisa de macOS 26.
  # ───────────────────────────────────────────────────────────────────────────
  apple:
    name: Daemon, PAM e iOS (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - name: Build do daemon
        run: swift build -c release --package-path macos

      - name: Testes do core
        # Onde os vetores encontram a implementação Swift. Se passarem, a
        # serialização está correta e os gêmeos iOS e Android têm alvo confiável.
        run: swift test --package-path macos

      - name: Módulo PAM com o clang do macOS
        # O job de Ubuntu já testou o comportamento; aqui o que se verifica é
        # que ele constrói como bundle no toolchain de destino real.
        run: |
          cd macos/pam
          make
          file pam_phoneauth.so

      - name: Compilar o app iOS
        # Sem .xcodeproj no repositório — um pbxproj é irrevisável em diff, e
        # num projeto de autenticação é por ali que um entitlement entra sem
        # ninguém ver. O Package.swift dá type-check completo, views SwiftUI
        # incluídas, sem precisar de projeto.
        run: |
          cd mobile/ios
          xcodebuild -scheme PhoneAuthKit \
                     -destination 'generic/platform=iOS' \
                     -skipPackagePluginValidation \
                     build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phoneauthd-${{ github.sha }}
          path: |
            macos/.build/release/phoneauthd
            macos/.build/release/phoneauthctl
            macos/pam/pam_phoneauth.so
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # App de barra de menu. Máquina explícita porque Liquid Glass não existe
  # antes do SDK 26 — e sem `continue-on-error`: com a máquina certa, falhar
  # aqui é falha de verdade e tem que ficar vermelho.
  # ───────────────────────────────────────────────────────────────────────────
  apple-ui:
    name: Barra de menu, Liquid Glass (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar o SDK
        # Assertiva, não detecção. A versão do runner é escolhida acima; isto
        # existe para a imagem não derivar em silêncio e passarmos a compilar
        # contra um SDK antigo alegando sucesso — um build verde que não
        # exercitou o código é pior que um build ausente.
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "SDK do macOS: $sdk"
          case "$sdk" in
            26.*|2[7-9].*|[3-9][0-9].*) ;;
            *) echo "::error::runner macos-26 entregou SDK $sdk; Liquid Glass precisa de 26+"; exit 1 ;;
          esac

      - name: Build da UI
        run: swift build -c release --package-path macos/ui

      - name: Empacotar o .app
        run: |
          cd macos/ui
          ./bundle.sh
          # Sem bundle identifier o UNUserNotificationCenter falha em silêncio,
          # então conferir que o Info.plist entrou é barato e pega regressão.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' .build/PhoneAuth.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' .build/PhoneAuth.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhoneAuth-app-${{ github.sha }}
          path: macos/ui/.build/PhoneAuth.app
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        # SignedPayloadTest é JVM puro de propósito: os vetores cross-plataforma
        # rodam sem emulador, no job mais barato possível.
        run: gradle --project-dir mobile/android testDebugUnitTest --no-daemon

      - name: Build do APK de debug
        run: gradle --project-dir mobile/android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phoneauth-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
