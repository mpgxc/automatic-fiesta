name: Landing page

on:
  push:
    branches: [claude/biometric-macos-mobile-auth-n8b08t]
    paths:
      - 'docs/landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# `contents: read` para o checkout; os outros dois são o que o deploy no Pages
# exige — `id-token` porque o deploy-pages troca um token OIDC pela permissão
# de publicar, em vez de usar um PAT guardado como segredo.
permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` de propósito, ao contrário do CI: cancelar um
# deploy pela metade deixa o site publicado num estado que não corresponde a
# commit nenhum. Melhor enfileirar e publicar as duas versões em ordem.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Montar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guarda — a página não pode depender de recurso externo
        # A promessa da landing é abrir de qualquer lugar, inclusive `file://`,
        # sem CDN, sem fonte remota, sem analytics. É fácil de quebrar sem
        # perceber: basta alguém colar um `<script src>` ou um `@import` de
        # fonte. Aqui a quebra vira build vermelho em vez de uma requisição
        # silenciosa saindo do navegador de quem visita.
        #
        # `<a href>` externo é permitido: é navegação que o usuário escolhe,
        # não subrecurso que o navegador busca sozinho.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          html = pathlib.Path("docs/landing/index.html").read_text(encoding="utf-8")
          achados = []

          # O que importa é subrecurso — o que o navegador busca sozinho ao abrir
          # a página. Um `data:` é inline, então passa. Metadado que não carrega
          # nada (canonical, alternate) também: são declarações sobre a página,
          # e ali a URL absoluta é justamente o uso correto.
          METADADO = {"canonical", "alternate"}

          def inline(url):
              return url.strip().lower().startswith("data:")

          for m in re.finditer(r'\bsrc\s*=\s*"([^"]*)"', html):
              if not inline(m.group(1)):
                  achados.append(("src=", m.group(1)))

          for m in re.finditer(r'<link\b[^>]*>', html, re.I):
              tag = m.group(0)
              rel = re.search(r'\brel\s*=\s*"([^"]*)"', tag, re.I)
              if rel and set(rel.group(1).lower().split()) & METADADO:
                  continue
              href = re.search(r'\bhref\s*=\s*"([^"]*)"', tag, re.I)
              if not (href and inline(href.group(1))):
                  achados.append(("<link>", tag[:90]))

          for m in re.finditer(r'@import[^;]*;', html, re.I):
              achados.append(("@import", m.group(0)[:90]))
          for m in re.finditer(r'url\(\s*[\'"]?(?:https?:)?//[^)]*\)', html, re.I):
              achados.append(("url() remoto", m.group(0)[:90]))

          if achados:
              for tipo, trecho in achados:
                  print(f"::error file=docs/landing/index.html::subrecurso externo ({tipo}): {trecho}")
              sys.exit(1)
          print("nenhum subrecurso externo — a página continua autocontida")
          PY

      - name: Guarda — o HTML e os SVGs precisam parsear
        # Um SVG malformado não explode: ele some. O elemento simplesmente não
        # renderiza e o resto da página parece bem. Publicar isso sem perceber é
        # o modo de falha mais provável desta página, então ele é verificado
        # antes de o site ir ao ar.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          html = pathlib.Path("docs/landing/index.html").read_text(encoding="utf-8")
          problemas = []

          VOID = {"area","base","br","col","embed","hr","img","input","link",
                  "meta","param","source","track","wbr"}

          class Checa(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.pilha = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID: self.pilha.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in VOID: return
                  if not self.pilha:
                      problemas.append(f"</{tag}> sem abertura, linha {self.getpos()[0]}"); return
                  topo, pos = self.pilha[-1]
                  if topo != tag:
                      problemas.append(f"</{tag}> fecha <{topo}> de {pos}, linha {self.getpos()[0]}")
                  else:
                      self.pilha.pop()

          corpo = re.sub(r"<script>.*?</script>", "<script></script>", html, flags=re.S)
          c = Checa(); c.feed(corpo)
          if c.pilha:
              problemas.append(f"nunca fechados: {[t for t, _ in c.pilha]}")

          svgs = re.findall(r"<svg\b.*?</svg>", corpo, flags=re.S)
          for i, s in enumerate(svgs):
              try:
                  ET.fromstring(s)
              except ET.ParseError as e:
                  problemas.append(f"svg #{i} malformado: {e}")

          if problemas:
              for p in problemas:
                  print(f"::error file=docs/landing/index.html::{p}")
              sys.exit(1)
          print(f"HTML equilibrado e {len(svgs)} SVGs bem formados")
          PY

      - name: Montar o _site
        # A landing vira a raiz do site. Só ela: os .md de `docs/` seriam
        # servidos crus pelo Pages, sem Jekyll para renderizá-los, então o
        # rodapé aponta para o GitHub, que os exibe formatados.
        run: |
          mkdir -p _site
          cp docs/landing/index.html _site/index.html
          ls -la _site

      - id: pages
        uses: actions/configure-pages@v5
        # Tentativa, não garantia. `enablement: true` só liga o Pages quando o
        # GITHUB_TOKEN tem permissão para criar o site — o que depende do plano
        # da conta e das políticas do repositório. Quando não tem, a action
        # devolve "Resource not accessible by integration", que não diz a
        # ninguém o que fazer. Daí o `continue-on-error` e o passo seguinte.
        continue-on-error: true
        with:
          enablement: true

      - name: Explicar a falha de habilitação
        if: steps.pages.outcome != 'success'
        # Este passo existe só para transformar um 403 opaco em instrução. O
        # build falha do mesmo jeito; a diferença é que quem abrir o run
        # descobre o que precisa acontecer para o site subir.
        run: |
          {
            echo "## O GitHub Pages não está habilitado neste repositório"
            echo
            echo 'O site foi montado e validado — as duas guardas passaram e o'
            echo '`_site` está pronto. O que faltou foi só a publicação: o'
            echo '`GITHUB_TOKEN` não conseguiu habilitar o Pages sozinho.'
            echo
            echo 'Criar o site do Pages pela API exige permissão de administração'
            echo 'do repositório, que o token do workflow não tem. É uma vez só:'
            echo
            echo '**Settings → Pages → Source: "GitHub Actions"**'
            echo
            echo 'Feito isso, re-execute este workflow. A partir daí todo push em'
            echo '`docs/landing/**` publica sozinho.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages não habilitado. Vá em Settings → Pages → Source: \"GitHub Actions\" e re-execute este workflow."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Conferir que a URL publicada serve a nossa página
        # Um deploy verde não prova que o site ficou certo. Quando a origem do
        # Pages está em "Deploy from a branch", o GitHub roda um build de Jekyll
        # em paralelo e publica o README na mesma URL — os dois workflows
        # terminam em verde e vence o último a subir. Já aconteceu aqui, e
        # passou despercebido justamente porque nada olhava o resultado.
        #
        # O marcador é um comentário HTML no topo de docs/landing/index.html.
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "verificando $url"
          for tentativa in 1 2 3 4 5 6; do
            corpo=$(curl -fsSL --max-time 20 "$url" || true)
            if printf '%s' "$corpo" | grep -q 'PHONEAUTH-LANDING-V1'; then
              echo "✓ a página no ar é a landing deste repositório"
              exit 0
            fi
            gerador=$(printf '%s' "$corpo" | grep -oiE 'name="generator" content="[^"]*"' || true)
            echo "  tentativa $tentativa: ainda não é a nossa página ${gerador:+($gerador)}"
            sleep 10
          done

          {
            echo "## O deploy subiu, mas a URL serve outra coisa"
            echo
            echo "O marcador \`PHONEAUTH-LANDING-V1\` não apareceu em <$url>."
            echo
            if printf '%s' "$corpo" | grep -qi 'jekyll'; then
              echo 'A resposta veio do **Jekyll**, o que significa que a origem do'
              echo 'Pages está em "Deploy from a branch". Nessa configuração o'
              echo 'GitHub publica o repositório processado por Jekyll e sobrescreve'
              echo 'o que este workflow envia.'
              echo
              echo '**Settings → Pages → Source: "GitHub Actions"**'
            else
              echo 'Pode ser cache de CDN ainda propagando, ou outra origem'
              echo 'publicando na mesma URL. Confira Settings → Pages.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::A URL publicada não serve esta landing. Veja o resumo do run."
          exit 1
