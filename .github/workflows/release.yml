name: Release

on:
  # O caminho normal: mudar o VERSION na raiz e mergear. O merge é o ato de
  # publicar, e é explícito — o arquivo não serve para mais nada, então tocá-lo
  # É a intenção. Sem tag para empurrar, sem botão para lembrar de apertar,
  # sem uma segunda declaração de versão para manter em dia.
  push:
    branches: [main]
    paths: ['VERSION']

  # Escotilha: republicar sem mexer no VERSION. Sem campo de versão de
  # propósito — ela vem do VERSION como em todo o resto, e um campo digitável
  # seria uma segunda fonte da verdade entrando pela porta dos fundos.
  #
  # Não há gatilho por tag. A tag passou a ser consequência da publicação, não
  # causa: quem a empurra à mão não publica nada. Um `push: tags` aqui também
  # colidiria com o filtro de `paths` acima, que não se aplica a tags.
  workflow_dispatch:

# `contents: write` é o que permite criar a release e anexar os arquivos. É a
# única permissão elevada aqui, e só este workflow a tem — o CI e o Pages
# seguem com o mínimo.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  coerencia:
    name: Ler e validar o VERSION
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        # Não há mais o que conferir entre duas declarações — só existe uma. O
        # que sobrou é validar o formato, porque tudo deriva daqui: o
        # versionCode do Android é calculado a partir destes três números, e um
        # VERSION malformado quebraria o build do Android com uma mensagem que
        # não apontaria para cá.
        run: |
          versao="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION = '$versao'"

          if ! printf '%s' "$versao" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION precisa ser MAJOR.MINOR.PATCH; veio '$versao'"
            exit 1
          fi

          # Aviso, não erro: republicar é o propósito declarado do
          # workflow_dispatch, e falhar aqui tiraria a escotilha justamente de
          # quem foi buscá-la. Mas ninguém deve descobrir por acaso que
          # sobrescreveu uma release.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$versao" >/dev/null 2>&1; then
            echo "::warning::a release v$versao já existe; os artefatos serão substituídos"
          fi

          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "tag=v$versao"   >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # ───────────────────────────────────────────────────────────────────────────
  macos:
    name: Daemon, CLI e módulo PAM
    needs: coerencia
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal do daemon e da CLI
        # arm64 + x86_64 no mesmo binário. Os runners são Apple Silicon; sem o
        # `--arch` duplo o pacote sairia arm64-only e não rodaria em nenhum Mac
        # Intel — que é justamente uma das máquinas citadas na landing como
        # candidata (o Mac mini sem Touch ID).
        run: swift build -c release --arch arm64 --arch x86_64 --package-path macos

      - name: Build universal do módulo PAM
        # As flags repetem exatamente o default do Makefile mais os dois `-arch`
        # — `CFLAGS` na linha de comando sobrescreve o `?=` inteiro, então não
        # dá para só acrescentar. Sem `-Werror` de propósito: quem faz cumprir
        # zero-warning é o CI, com gcc, a cada push. Repeti-lo aqui com clang
        # significaria descobrir uma divergência de compilador na hora de
        # publicar, e uma tag não se reaproveita.
        run: |
          make -C macos/pam \
            CFLAGS="-Wall -Wextra -Wconversion -Wshadow -Wpointer-arith -Wwrite-strings -O2 -std=gnu11 -fstack-protector-strong -arch arm64 -arch x86_64"

      - name: Localizar os binários
        id: bin
        # O SwiftPM muda o diretório de saída conforme o build: `.build/release`
        # para arquitetura única, `.build/apple/Products/Release` para
        # universal. São só esses dois, então testá-los diretamente é mais
        # honesto do que varrer a árvore.
        #
        # A primeira versão usava `find -perm -u+x` e falhou no runner: o find
        # do macOS é BSD e não interpreta modo simbólico como o do GNU. `test
        # -x` é POSIX e não tem esse tipo de divergência.
        run: |
          dir=""
          for candidato in macos/.build/apple/Products/Release macos/.build/release; do
            if [ -x "$candidato/phoneauthd" ] && [ -x "$candidato/phoneauthctl" ]; then
              dir="$candidato"; break
            fi
          done

          if [ -z "$dir" ]; then
            echo "::error::não achei phoneauthd e phoneauthctl executáveis sob macos/.build"
            # Arquivos, não só diretórios: a versão anterior deste diagnóstico
            # listava `-type d` e escondia exatamente o que era preciso ver.
            find macos/.build -maxdepth 5 \( -name 'phoneauth*' -o -name Release \) -print
            exit 1
          fi

          echo "encontrados em $dir"
          ls -la "$dir/phoneauthd" "$dir/phoneauthctl"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Confirmar que tudo é universal
        # `lipo` é a única prova real. Um `-arch` que o compilador ignorasse
        # silenciosamente produziria um pacote que só falha na máquina do
        # usuário Intel, e aí já é tarde.
        run: |
          falhou=0
          for b in "${{ steps.bin.outputs.dir }}/phoneauthd" \
                   "${{ steps.bin.outputs.dir }}/phoneauthctl" \
                   macos/pam/pam_phoneauth.so; do
            archs=$(lipo -archs "$b")
            echo "$b: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$b não é universal ($archs)"; falhou=1 ;;
            esac
          done
          exit $falhou

      - name: Montar o tarball
        # O layout do repositório é preservado de propósito: o install.sh
        # procura `macos/.build/release/...`, e assim o mesmo script serve o
        # checkout e o pacote. As fontes ficam de fora — é a ausência delas que
        # faz o script pular a compilação.
        run: |
          v="${{ needs.coerencia.outputs.versao }}"
          raiz="phoneauth-$v-macos"
          mkdir -p "$raiz/macos/.build/release" "$raiz/macos/pam" "$raiz/macos/LaunchDaemon" "$raiz/scripts"

          cp "${{ steps.bin.outputs.dir }}/phoneauthd"   "$raiz/macos/.build/release/"
          cp "${{ steps.bin.outputs.dir }}/phoneauthctl" "$raiz/macos/.build/release/"
          cp macos/pam/pam_phoneauth.so                  "$raiz/macos/pam/"
          cp macos/LaunchDaemon/dev.phoneauth.daemon.plist    "$raiz/macos/LaunchDaemon/"
          cp scripts/install.sh                               "$raiz/scripts/"
          cp docs/instalacao.md docs/modelo-de-ameacas.md     "$raiz/"
          chmod +x "$raiz/scripts/install.sh"

          cat > "$raiz/LEIA-ME.txt" <<TXT
          PhoneAuth $v — daemon macOS, CLI e módulo PAM

              sudo ./scripts/install.sh

          Binários universais (arm64 + x86_64), macOS 13 ou superior.

          NÃO SÃO ASSINADOS NEM NOTARIZADOS. O macOS põe em quarentena o que
          vem da internet; se o Gatekeeper reclamar, remova o atributo antes
          de instalar:

              xattr -dr com.apple.quarantine .

          Faça isso só depois de conferir o que baixou. Este pacote contém um
          módulo PAM, que roda como root dentro do sudo.

          Depois de instalar faltam dois passos, nesta ordem: parear o celular
          com 'sudo phoneauthctl pair' e só então plugar o módulo no
          /etc/pam.d/sudo_local. O install.sh explica ambos ao terminar, e
          instalacao.md tem o detalhe.

          O módulo entra como 'sufficient', jamais 'required' — daemon fora do
          ar ou celular sem bateria fazem o macOS voltar a pedir a senha.
          TXT

          tar -czf "$raiz.tar.gz" "$raiz"
          shasum -a 256 "$raiz.tar.gz" | tee "$raiz.tar.gz.sha256"

      - name: Construir o instalador .pkg
        # Mesmo script que o CI roda a cada push, então o caminho de
        # empacotamento chega aqui já exercitado — não é código que só acorda
        # na hora de publicar.
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          v="${{ needs.coerencia.outputs.versao }}"
          chmod +x macos/installer/build-pkg.sh macos/installer/scripts/postinstall
          macos/installer/build-pkg.sh "$v" "${{ steps.bin.outputs.dir }}" "phoneauth-$v.pkg"
          shasum -a 256 "phoneauth-$v.pkg" | tee "phoneauth-$v.pkg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            phoneauth-*-macos.tar.gz
            phoneauth-*-macos.tar.gz.sha256
            phoneauth-*.pkg
            phoneauth-*.pkg.sha256
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: APK de release
    needs: coerencia
    runs-on: ubuntu-latest
    outputs:
      assinado: ${{ steps.keystore.outputs.assinado }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - id: keystore
        name: Preparar a keystore, se houver
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
            echo "keystore presente; o APK sairá assinado"
          else
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::sem ANDROID_KEYSTORE_BASE64; o APK sairá SEM assinatura e não instala"
          fi

      - name: Build de release
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --project-dir mobile/android assembleRelease --no-daemon

      - name: Renomear e somar
        run: |
          v="${{ needs.coerencia.outputs.versao }}"
          origem=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          case "$origem" in
            *unsigned*) destino="phoneauth-$v-SEM-ASSINATURA.apk" ;;
            *)          destino="phoneauth-$v.apk" ;;
          esac
          cp "$origem" "$destino"
          sha256sum "$destino" | tee "$destino.sha256"
          ls -la "$destino"

      - name: Guardar o mapping do R8
        # Sem o mapping.txt desta build específica, todo stack trace vindo de
        # usuário é indecifrável. Ele não vai para a release por ser material
        # de depuração, mas some junto com o runner se não for retido.
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            phoneauth-*.apk
            phoneauth-*.apk.sha256
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar a release
    needs: [coerencia, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }

      - name: Escrever as notas
        env:
          VERSAO: ${{ needs.coerencia.outputs.versao }}
          ASSINADO: ${{ needs.android.outputs.assinado }}
        run: |
          ls -la dist
          {
            echo "Daemon macOS e app Android do PhoneAuth."
            echo
            echo "## macOS"
            echo
            echo "**\`phoneauth-$VERSAO.pkg\`** — instalador. Duplo-clique, ou:"
            echo
            echo '```'
            echo "sudo installer -pkg phoneauth-$VERSAO.pkg -target /"
            echo '```'
            echo
            echo "Copia os binários, o módulo PAM e o LaunchDaemon, gera a"
            echo "identidade TLS **na sua máquina** e sobe o daemon. A chave"
            echo "privada nunca vem no pacote — se viesse, seria a mesma chave em"
            echo "toda instalação do mundo e o pinning não valeria nada."
            echo
            echo "Ele **não** toca em \`/etc/pam.d\`. Plugar o módulo no \`sudo\` é"
            echo "a única etapa capaz de estragar sua autenticação, e você deve"
            echo "estar olhando quando acontecer — a tela final do instalador"
            echo "explica os dois passos que faltam."
            echo
            echo "\`phoneauth-$VERSAO-macos.tar.gz\` é a alternativa para quem"
            echo "prefere script a instalador gráfico: \`sudo ./scripts/install.sh\`."
            echo
            echo "Binários universais (arm64 + x86_64), macOS 13+."
            echo "**Não assinados nem notarizados** — não há conta paga no Apple"
            echo "Developer Program. O Gatekeeper vai barrar; \`xattr -dr"
            echo "com.apple.quarantine .\` libera, e só faça isso depois de olhar"
            echo "o que baixou: o pacote traz um módulo PAM que roda como root."
            echo
            echo "Instalar não ativa nada. O módulo só entra na sua pilha de"
            echo "autenticação quando você editar \`/etc/pam.d/sudo_local\` à mão,"
            echo "e ele entra como \`sufficient\`, jamais \`required\` — daemon fora"
            echo "do ar faz o macOS voltar a pedir a senha, não te trancar fora."
            echo
            echo "## Android"
            echo
            if [ "$ASSINADO" = "sim" ]; then
              echo "\`phoneauth-$VERSAO.apk\` — Android 10+ (minSdk 29)."
            else
              echo "\`phoneauth-$VERSAO-SEM-ASSINATURA.apk\` — Android 10+ (minSdk 29)."
              echo
              echo "> **Este APK não instala.** Saiu sem assinatura porque o"
              echo "> repositório não tem a keystore configurada em secrets."
              echo "> Para assiná-lo, defina \`ANDROID_KEYSTORE_BASE64\`,"
              echo "> \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\` e"
              echo "> \`ANDROID_KEY_PASSWORD\` e refaça a tag. Assinar localmente"
              echo "> com \`apksigner\` também funciona."
            fi
            echo
            echo "## Verificação"
            echo
            echo "Cada arquivo tem um \`.sha256\` ao lado."
            echo
            echo "## Estado do projeto"
            echo
            echo "Primeira versão publicada. Não cobre desbloqueio do FileVault"
            echo "no boot nem os diálogos gráficos do SecurityAgent — só a pilha"
            echo "PAM (sudo, su). Exige o celular na mesma rede local."
          } > notas.md
          cat notas.md

      - name: Criar ou completar a release
        # Três rotas chegam aqui e todas terminam no mesmo lugar:
        #
        #   · workflow_dispatch — não existe tag nem release; `gh release
        #     create --target` cria as duas, apontando para o commit que este
        #     run realmente construiu.
        #   · push de tag — a tag existe, a release não.
        #   · "Draft a new release" na interface — tag e release já existem, e
        #     um `create` cru falharia com "already exists" depois de todo o
        #     build, deixando a release publicada e vazia.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.coerencia.outputs.tag }}
          TITULO: PhoneAuth ${{ needs.coerencia.outputs.versao }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG já existe; completando com as notas e os arquivos"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" --notes-file notas.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
            exit 0
          fi

          # `--target` só quando a tag ainda não existe. Passá-lo sobre uma tag
          # existente pediria para movê-la, e mover tag publicada é pior do que
          # o problema que resolveria.
          alvo=()
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG já existe; criando a release sobre ela"
          else
            echo "criando tag $TAG em $GITHUB_SHA"
            alvo=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" --notes-file notas.md "${alvo[@]}" dist/*
