name: Release

on:
  # Toda mudança que chega em main vira release. O patch avança sozinho; quem
  # quiser escolher a versão — minor ou major — edita o VERSION no próprio PR e
  # o workflow respeita o que estiver escrito.
  #
  # Para um merge que não deve publicar, ponha `[skip release]` na mensagem do
  # commit de merge. É a escotilha, e ela é explícita: preferimos que alguém
  # peça para pular a que o workflow adivinhe o que "merece" uma versão.
  push:
    branches: [main]

  # Republicar a versão que estiver no VERSION, sem mexer em nada.
  workflow_dispatch:

# `contents: write` é o que permite criar a release e anexar os arquivos. É a
# única permissão elevada aqui, e só este workflow a tem — o CI e o Pages
# seguem com o mínimo.
permissions:
  contents: write

# Sem `github.ref` no grupo: dois merges seguidos em main são o mesmo ref, e
# precisam enfileirar em vez de correr juntos — senão os dois leem o mesmo
# VERSION e disputam a mesma versão.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  versao:
    name: Decidir a versão
    runs-on: ubuntu-latest
    outputs:
      versao:   ${{ steps.v.outputs.versao }}
      tag:      ${{ steps.v.outputs.tag }}
      sha:      ${{ steps.v.outputs.sha }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O passo pode commitar o bump de volta; precisa da credencial e do
          # histórico para isso.
          fetch-depth: 0
          persist-credentials: true

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git log -1 --pretty=%B | grep -qiF '[skip release]'; then
            echo "commit pede [skip release]; nada a publicar"
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declarada="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$declarada" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION precisa ser MAJOR.MINOR.PATCH; veio '$declarada'"
            exit 1
          fi

          # Compara com o que está PUBLICADO, não com o histórico do git. É o
          # que sobrevive a rebase, squash e merge commit sem precisar entender
          # nenhum dos três.
          ultima="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')"
          echo "declarada no VERSION: $declarada    última publicada: ${ultima:-nenhuma}"

          if [ -z "$ultima" ] || [ "$declarada" != "$ultima" ]; then
            # Ou é a primeira release, ou alguém escolheu a versão à mão no PR.
            # Nos dois casos, a intenção humana ganha.
            versao="$declarada"
            bump=nao
          else
            IFS=. read -r maior menor patch <<< "$declarada"
            versao="$maior.$menor.$((patch + 1))"
            bump=sim
          fi
          echo "versão desta release: $versao"

          sha="$GITHUB_SHA"
          if [ "$bump" = sim ]; then
            # O VERSION precisa estar bumpado ANTES do build: o versionName e o
            # versionCode do APK derivam dele. Por isso o commit volta para main
            # e os jobs seguintes constroem a partir dele, não do merge.
            printf '%s\n' "$versao" > VERSION
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -q -m "Versão $versao

          Bump automático: toda mudança em main publica uma release e o patch
          avança sozinho. Para escolher a versão à mão, edite o VERSION no
          próprio PR — o workflow respeita o que estiver escrito.

          [skip release]"

            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "::error::não consegui empurrar o bump do VERSION para $GITHUB_REF_NAME."
              echo "::error::O versionamento automático precisa que este workflow possa escrever em main — verifique proteção de branch. Alternativa: bumpar o VERSION à mão no PR."
              exit 1
            fi
            sha="$(git rev-parse HEAD)"
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$versao" >/dev/null 2>&1; then
            echo "::warning::a release v$versao já existe; os artefatos serão substituídos"
          fi

          echo "versao=$versao"   >> "$GITHUB_OUTPUT"
          echo "tag=v$versao"     >> "$GITHUB_OUTPUT"
          echo "sha=$sha"         >> "$GITHUB_OUTPUT"
          echo "publicar=sim"     >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  macos:
    name: Daemon, CLI e módulo PAM
    needs: versao
    if: needs.versao.outputs.publicar == 'sim'
    runs-on: macos-15
    steps:
      # O commit do bump, não o de merge: é ele que tem o VERSION desta
      # release, e é dele que o tarball e o .pkg precisam sair.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - name: Build universal do daemon e da CLI
        # arm64 + x86_64 no mesmo binário. Os runners são Apple Silicon; sem o
        # `--arch` duplo o pacote sairia arm64-only e não rodaria em nenhum Mac
        # Intel — que é justamente uma das máquinas citadas na landing como
        # candidata (o Mac mini sem Touch ID).
        run: swift build -c release --arch arm64 --arch x86_64 --package-path macos

      - name: Build universal do módulo PAM
        # As flags repetem exatamente o default do Makefile mais os dois `-arch`
        # — `CFLAGS` na linha de comando sobrescreve o `?=` inteiro, então não
        # dá para só acrescentar. Sem `-Werror` de propósito: quem faz cumprir
        # zero-warning é o CI, com gcc, a cada push. Repeti-lo aqui com clang
        # significaria descobrir uma divergência de compilador na hora de
        # publicar, e uma tag não se reaproveita.
        run: |
          make -C macos/pam \
            CFLAGS="-Wall -Wextra -Wconversion -Wshadow -Wpointer-arith -Wwrite-strings -O2 -std=gnu11 -fstack-protector-strong -arch arm64 -arch x86_64"

      - name: Localizar os binários
        id: bin
        # O SwiftPM muda o diretório de saída conforme o build: `.build/release`
        # para arquitetura única, `.build/apple/Products/Release` para
        # universal. São só esses dois, então testá-los diretamente é mais
        # honesto do que varrer a árvore.
        #
        # A primeira versão usava `find -perm -u+x` e falhou no runner: o find
        # do macOS é BSD e não interpreta modo simbólico como o do GNU. `test
        # -x` é POSIX e não tem esse tipo de divergência.
        run: |
          dir=""
          for candidato in macos/.build/apple/Products/Release macos/.build/release; do
            if [ -x "$candidato/phoneauthd" ] && [ -x "$candidato/phoneauthctl" ]; then
              dir="$candidato"; break
            fi
          done

          if [ -z "$dir" ]; then
            echo "::error::não achei phoneauthd e phoneauthctl executáveis sob macos/.build"
            # Arquivos, não só diretórios: a versão anterior deste diagnóstico
            # listava `-type d` e escondia exatamente o que era preciso ver.
            find macos/.build -maxdepth 5 \( -name 'phoneauth*' -o -name Release \) -print
            exit 1
          fi

          echo "encontrados em $dir"
          ls -la "$dir/phoneauthd" "$dir/phoneauthctl"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Confirmar que tudo é universal
        # `lipo` é a única prova real. Um `-arch` que o compilador ignorasse
        # silenciosamente produziria um pacote que só falha na máquina do
        # usuário Intel, e aí já é tarde.
        run: |
          falhou=0
          for b in "${{ steps.bin.outputs.dir }}/phoneauthd" \
                   "${{ steps.bin.outputs.dir }}/phoneauthctl" \
                   macos/pam/pam_phoneauth.so; do
            archs=$(lipo -archs "$b")
            echo "$b: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$b não é universal ($archs)"; falhou=1 ;;
            esac
          done
          exit $falhou

      - name: Montar o tarball
        # Mesmo script que o CI roda a cada push — como o .pkg. A 0.1.4 saiu com
        # o tarball quebrado justamente porque esta montagem era um punhado de
        # `cp` aqui dentro: nunca passava pelo CI, e a man page que entrou na
        # lista de exigidos do install.sh não entrou na cópia.
        run: |
          v="${{ needs.versao.outputs.versao }}"
          chmod +x macos/installer/build-tarball.sh
          macos/installer/build-tarball.sh "$v" "${{ steps.bin.outputs.dir }}" \
            "phoneauth-$v-macos.tar.gz"
          shasum -a 256 "phoneauth-$v-macos.tar.gz" | tee "phoneauth-$v-macos.tar.gz.sha256"

      - name: Construir o instalador .pkg
        # Mesmo script que o CI roda a cada push, então o caminho de
        # empacotamento chega aqui já exercitado — não é código que só acorda
        # na hora de publicar.
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          v="${{ needs.versao.outputs.versao }}"
          chmod +x macos/installer/build-pkg.sh macos/installer/scripts/postinstall
          macos/installer/build-pkg.sh "$v" "${{ steps.bin.outputs.dir }}" "phoneauth-$v.pkg"
          shasum -a 256 "phoneauth-$v.pkg" | tee "phoneauth-$v.pkg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            phoneauth-*-macos.tar.gz
            phoneauth-*-macos.tar.gz.sha256
            phoneauth-*.pkg
            phoneauth-*.pkg.sha256
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: APK de release
    needs: versao
    if: needs.versao.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    outputs:
      assinatura: ${{ steps.apk.outputs.assinatura }}
    steps:
      # Idem: o versionName e o versionCode do APK derivam do VERSION deste
      # commit. Construir do merge produziria um APK com a versão anterior.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - id: keystore
        name: Preparar a keystore
        # Sem keystore o Gradle produz um APK sem assinatura nenhuma, e o
        # Android recusa esse arquivo já no parse. A release publicava, release
        # após release, um APK que não instalava em aparelho nenhum — e o
        # conserto ficava parado esperando alguém definir quatro secrets.
        #
        # Agora a ausência do secret não impede a assinatura: a build gera uma
        # chave descartável e assina com ela. O APK instala. O que se perde é a
        # estabilidade da identidade — a chave muda a cada release, então uma
        # instalação feita com a anterior recusa a nova por cima, e é preciso
        # desinstalar antes. Esse custo é real, mas é menor que publicar um
        # arquivo inútil, e tanto o nome do arquivo quanto as notas avisam.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          caminho="$RUNNER_TEMP/release.jks"

          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$caminho"
            echo "origem=secret" >> "$GITHUB_OUTPUT"
            echo "keystore veio dos secrets do repositório"
          else
            # A senha nasce e morre dentro deste job. O add-mask a esconde do
            # log antes de ela aparecer em qualquer lugar.
            senha="$(openssl rand -base64 24)"
            echo "::add-mask::$senha"

            keytool -genkeypair -noprompt \
              -keystore "$caminho" -storepass "$senha" -keypass "$senha" \
              -alias phoneauth -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=PhoneAuth (chave temporaria de CI), O=PhoneAuth"

            echo "origem=temporaria" >> "$GITHUB_OUTPUT"
            echo "senha=$senha" >> "$GITHUB_OUTPUT"
            echo "alias=phoneauth" >> "$GITHUB_OUTPUT"
            echo "::warning::sem ANDROID_KEYSTORE_BASE64: assinando com chave descartável. O APK instala, mas não atualiza por cima de instalação feita por outra release. Defina os quatro secrets para ter assinatura estável."
          fi

          echo "path=$caminho" >> "$GITHUB_OUTPUT"

      - name: Build de release
        # A ordem do `||` importa e não é a intuitiva: os valores da chave
        # gerada vêm ANTES dos secrets. Quando a keystore veio do secret, os
        # outputs do passo anterior estão vazios e os secrets assumem, como se
        # espera. Mas quando a chave foi gerada aqui, ela tem senha própria — e
        # um repositório com ANDROID_KEYSTORE_PASSWORD definido e
        # ANDROID_KEYSTORE_BASE64 faltando (secrets preenchidos pela metade)
        # tentaria abrir a chave gerada com a senha do secret, e a build
        # quebraria por um motivo difícil de enxergar no log. Quem gerou a
        # chave é quem sabe a senha dela.
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.senha || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.alias || secrets.ANDROID_KEY_ALIAS || 'phoneauth' }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.senha || secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --project-dir mobile/android assembleRelease --no-daemon

      - id: apk
        name: Verificar a assinatura, nomear e somar
        # O rótulo "assinado" vinha de duas suposições independentes: o secret
        # existir, e o nome que o Gradle deu ao arquivo. Nenhuma das duas olhava
        # o artefato. Se a assinatura falhasse em silêncio — alias errado,
        # keystore que decodifica para lixo — a release anunciaria um APK
        # assinado que não instala, que é exatamente o problema que o rótulo
        # existe para evitar. Agora quem decide é o apksigner.
        #
        # E agora que a build sempre tem uma keystore, APK sem assinatura deixou
        # de ser um estado previsto: se acontecer, é defeito, e a release para
        # aqui em vez de anexar o arquivo.
        env:
          ORIGEM_CHAVE: ${{ steps.keystore.outputs.origem }}
        run: |
          v="${{ needs.versao.outputs.versao }}"
          apk=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK construído: $apk"

          # apksigner vive no build-tools do SDK, que já está no runner — o
          # próprio assembleRelease depende dele.
          raiz="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=$(ls -d "$raiz"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner não encontrado sob $raiz/build-tools; sem ele não há como afirmar se o APK está assinado"
            exit 1
          fi

          if ! "$apksigner" verify --print-certs "$apk"; then
            echo "::error::o APK saiu sem assinatura válida mesmo com keystore disponível (origem: $ORIGEM_CHAVE). Confira ANDROID_KEY_ALIAS e as senhas; a release não será publicada com um APK que não instala."
            exit 1
          fi
          echo "assinatura verificada pelo apksigner"

          # O sufixo no nome é o que separa um APK que atualiza por cima do
          # anterior de um que exige desinstalar antes. Quem baixa precisa saber
          # disso antes de instalar, não depois de ver "app não instalado".
          if [ "$ORIGEM_CHAVE" = secret ]; then
            destino="phoneauth-$v.apk"
          else
            destino="phoneauth-$v-CHAVE-TEMPORARIA.apk"
          fi

          cp "$apk" "$destino"
          sha256sum "$destino" | tee "$destino.sha256"
          ls -la "$destino"
          echo "assinatura=$ORIGEM_CHAVE" >> "$GITHUB_OUTPUT"

      - name: Guardar o mapping do R8
        # Sem o mapping.txt desta build específica, todo stack trace vindo de
        # usuário é indecifrável. Ele não vai para a release por ser material
        # de depuração, mas some junto com o runner se não for retido.
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            phoneauth-*.apk
            phoneauth-*.apk.sha256
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar a release
    needs: [versao, macos, android]
    if: needs.versao.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }

      - name: Escrever as notas
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
          ASSINATURA: ${{ needs.android.outputs.assinatura }}
        run: |
          ls -la dist
          {
            echo "Daemon macOS e app Android do PhoneAuth."
            echo
            echo "## macOS"
            echo
            echo "**\`phoneauth-$VERSAO.pkg\`** — instalador. Duplo-clique, ou:"
            echo
            echo '```'
            echo "sudo installer -pkg phoneauth-$VERSAO.pkg -target /"
            echo '```'
            echo
            echo "Copia os binários, o módulo PAM e o LaunchDaemon, gera a"
            echo "identidade TLS **na sua máquina** e sobe o daemon. A chave"
            echo "privada nunca vem no pacote — se viesse, seria a mesma chave em"
            echo "toda instalação do mundo e o pinning não valeria nada."
            echo
            echo "Ele **não** toca em \`/etc/pam.d\`. Plugar o módulo no \`sudo\` é"
            echo "a única etapa capaz de estragar sua autenticação, e você deve"
            echo "estar olhando quando acontecer — a tela final do instalador"
            echo "explica os dois passos que faltam."
            echo
            echo "\`phoneauth-$VERSAO-macos.tar.gz\` é a alternativa para quem"
            echo "prefere script a instalador gráfico: \`sudo ./scripts/install.sh\`."
            echo
            echo "Binários universais (arm64 + x86_64), macOS 13+."
            echo "**Não assinados nem notarizados** — não há conta paga no Apple"
            echo "Developer Program. O Gatekeeper vai barrar; \`xattr -dr"
            echo "com.apple.quarantine .\` libera, e só faça isso depois de olhar"
            echo "o que baixou: o pacote traz um módulo PAM que roda como root."
            echo
            echo "Instalar não ativa nada. O módulo só entra na sua pilha de"
            echo "autenticação quando você editar \`/etc/pam.d/sudo_local\` à mão,"
            echo "e ele entra como \`sufficient\`, jamais \`required\` — daemon fora"
            echo "do ar faz o macOS voltar a pedir a senha, não te trancar fora."
            echo
            echo "## Android"
            echo
            if [ "$ASSINATURA" = "secret" ]; then
              echo "\`phoneauth-$VERSAO.apk\` — Android 10+ (minSdk 29)."
              echo
              echo "Assinado com a chave do repositório. Instala por cima de uma"
              echo "release anterior sem desinstalar."
            else
              echo "\`phoneauth-$VERSAO-CHAVE-TEMPORARIA.apk\` — Android 10+ (minSdk 29)."
              echo
              echo "Instala normalmente, mas foi assinado com uma chave gerada na"
              echo "hora da build e descartada em seguida."
              echo
              echo "> **Se você já tem o PhoneAuth instalado, desinstale antes.**"
              echo "> A chave desta release não é a da anterior, e o Android recusa"
              echo "> atualização entre assinaturas diferentes — com o mesmo genérico"
              echo "> \"app não instalado\" de sempre. Desinstalar apaga o pareamento:"
              echo "> será preciso ler o QR de novo."
              echo
              echo "Para acabar com isso, dê ao repositório uma chave estável — uma"
              echo "vez, e nunca mais:"
              echo
              echo '```sh'
              echo "keytool -genkeypair -v -keystore release.jks \\"
              echo "  -alias phoneauth -keyalg RSA -keysize 4096 -validity 10000"
              echo
              echo "base64 -i release.jks | pbcopy   # vira ANDROID_KEYSTORE_BASE64"
              echo '```'
              echo
              echo "Depois defina os quatro secrets em Settings → Secrets and"
              echo "variables → Actions: \`ANDROID_KEYSTORE_BASE64\`,"
              echo "\`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\` (\`phoneauth\`)"
              echo "e \`ANDROID_KEY_PASSWORD\`. A próxima release já sai com o nome"
              echo "sem sufixo e atualiza por cima das instalações feitas com ela."
              echo
              echo "**Guarde o \`release.jks\` e as senhas.** A assinatura é a"
              echo "identidade do app: perder a chave impede qualquer atualização"
              echo "futura sobre as instalações existentes, e não há como recuperá-la."
            fi
            echo
            echo "## Verificação"
            echo
            echo "Cada arquivo tem um \`.sha256\` ao lado."
            echo
            echo "## Escopo"
            echo
            echo "Não cobre desbloqueio do FileVault no boot nem os diálogos"
            echo "gráficos do SecurityAgent — só a pilha PAM (\`sudo\`, \`su\`)."
            echo "Exige o celular na mesma rede local."
          } > notas.md

      - name: Anexar o changelog gerado
        # O GitHub monta "What's Changed" a partir dos PRs entre esta tag e a
        # anterior. Gerado pela API e concatenado aqui, em vez de passado como
        # `--generate-notes` ao `gh release create`: assim a ordem é nossa — as
        # instruções de instalação primeiro, o changelog depois — e o resultado
        # não muda conforme a versão do gh no runner.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
          SHA: ${{ needs.versao.outputs.sha }}
        run: |
          gerado="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      -f tag_name="$TAG" -f target_commitish="$SHA" \
                      --jq .body 2>/dev/null || true)"

          if [ -n "$gerado" ]; then
            { echo; echo "---"; echo; printf '%s\n' "$gerado"; } >> notas.md
            echo "changelog anexado"
          else
            # Não é motivo para falhar: a release com os artefatos e as
            # instruções vale mais do que a lista de PRs.
            echo "::warning::não consegui gerar o changelog; publicando sem ele"
          fi

          echo "── notas finais ──"
          cat notas.md
          cat notas.md

      - name: Criar ou completar a release
        # Duas rotas chegam aqui e as duas terminam no mesmo lugar: a release
        # nova, em que `gh release create --target` cria tag e release de uma
        # vez; e a republicação, em que ambas já existem e um `create` cru
        # falharia com "already exists" depois de todo o build, deixando a
        # release publicada e vazia.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
          TITULO: PhoneAuth ${{ needs.versao.outputs.versao }}
          # O commit do bump, que é o que foi construído — não o de merge.
          ALVO: ${{ needs.versao.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG já existe; completando com as notas e os arquivos"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" --notes-file notas.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
            exit 0
          fi

          # `--target` só quando a tag ainda não existe. Passá-lo sobre uma tag
          # existente pediria para movê-la, e mover tag publicada é pior do que
          # o problema que resolveria.
          alvo=()
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG já existe; criando a release sobre ela"
          else
            echo "criando tag $TAG em $ALVO"
            alvo=(--target "$ALVO")
          fi

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" --notes-file notas.md "${alvo[@]}" dist/*
